name: Dashboard CI

# Scoped to the dashboard app. Triggers only when its files change.
on:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard-ci.yml"

defaults:
  run:
    working-directory: apps/dashboard

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

# trace-harness — the core TRACE Python package.
#
# Install (editable, from the repo root):
#   pip install -e ".[dev]"
#
# The package is deliberately light on dependencies: pydantic is the only
# runtime requirement. Gemini support is an optional extra so that tests and
# fixture runs never need an API key.

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trace-harness"
version = "0.1.0"
description = "TRACE agent reliability harness: run agents through realistic workflows, capture traces, verify outcomes, and turn failures into evidence-backed artifacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Optional: the Gemini adapter uses the google-genai SDK. Installing this extra
# does NOT make tests require an API key — the fixture provider stays the
# default everywhere and the offline test suite never needs the SDK.
gemini = [
    "google-genai>=1.33,<2",
]
# Optional: the Anthropic adapter uses the anthropic SDK. Same rule as above,
# installing it does NOT make tests require a key. The offline tests stand a
# fake module in for it and never import this package. The calls the adapter
# makes were checked against 1.0.0 and 1.8.0. 1.x dropped temperature from
# messages.create, so the adapter sends it through extra_body.
anthropic = [
    "anthropic>=1.0,<2",
]
# Optional: the OpenAI adapter uses the openai SDK. Same rule again, installing
# it does NOT make tests require a key. The calls the adapter makes were checked
# against 3.0.0 and 3.19.2, the range openai-agents 0.22 also needs.
openai = [
    "openai>=3.0,<4",
]

[project.scripts]
trace-harness = "trace_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
